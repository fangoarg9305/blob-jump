(()=>{

let st='ready',P,pl,co,pt=[],cam,top,score,coins,shake=0,dieT=0,combo,comboT,held=false,T=0,revives=0,boost=false,inv=0,shield=false,shieldUsed=false,prev='ready',rank=[],btns=[],adBusy=false,lastSub=null;

function initShop(){
    if(shopItems.length===0){
        shopItems = [
            {id:1, name:'Skin Verde', price:50, owned:false},
            {id:2, name:'Skin Azul', price:75, owned:false},
            {id:3, name:'Escudo Extra', price:100, owned:false}, // da un escudo adicional al iniciar
            {id:4, name:'Monedas Dobles (1 partida)', price:200, owned:false} // consumible
        ];
        saveShop();
    }

function initMissions(){
    if(Object.keys(dailyMission).length===0 || dailyMission.completed){
        // Generar misión diaria aleatoria
        const missions = [
            {id:'dist_500', description:'Llega a 500 m', target:500, reward:25},
            {id:'coins_20', description:'Recoge 20 monedas', target:20, reward:30},
            {id:'revive_1', description:'Usa el revive una vez', target:1, reward:40},
            {id:'no_shield', description:'Llega a 300 m sin usar escudo', target:300, reward:35},
            {id:'combo_5', description:'Achieve combo 5', target:5, reward:30}
        ];
        const selected = missions[Math.floor(Math.random()*missions.length)];
        dailyMission = {
            id: selected.id,
            description: selected.description,
            target: selected.target,
            progress: 0,
            reward: selected.reward,
            completed: false
        };

    }

function saveShop(){localStorage.setItem('bj_shop_items', JSON.stringify(shopItems));}
function saveInventory(){localStorage.setItem('bj_inventory', JSON.stringify(playerInventory));}

function checkNewDay(){
    const today = Math.floor(Date.now() / 86400000);
    if(lastDailyReset !== today){
        lastDailyReset = today;
        dailyMission = {};

        saveMission();
    }

initShop();

function reset(){seed=Date.now()&0xffffff;pl=[{x:W/2-55,y:600,w:110,k:0,s:null,br:0,dead:false}];co=[];pt=[];score=0;coins=0;shake=0;combo=0;comboT=0;top=600;revives=0;inv=0;shield=boost;boost=false;shieldUsed=false;lastSub=null;
P={x:W/2,y:586,vx:0,vy:-720,dir:1,sq:0};cam=P.y-H*.7;while(top>cam-300)gen()}
function gen(){const d=Math.min(1,(600-top)/7000),w=R(88-d*30,106-d*34);top-=R(88,112+d*42);let k=0;const r=rnd();
if(r<.14+d*.18)k=1;else if(r<.32+d*.2)k=2;
const p={w,y:top,k,s:null,br:0,dead:false,ph:R(0,6.28)};
if(k==1){p.bx=R(53,W-53-w);p.x=p.bx}else p.x=R(8,W-8-w);
if(k!=2&&rnd()<.1+d*.35)p.s=R(5,w-21);
pl.push(p);if(rnd()<.45)co.push({x:p.x+w/2+R(-25,25),y:top-R(40,75)})}
function burst(x,y,n,c){for(let i=0;i<n;i++)pt.push({x,y,vx:R(-130,130),vy:R(-230,40),l:R(.3,.7),c,s:R(2,4.5)})}

function openRank(){prev=st;loadRank();st='rank'}
function openShop(){prev=st;st='shop'}
function openMissions(){prev=st;st='missions'}
function buyItem(itemId){
    let item = shopItems.find(i => i.id === itemId);
    if(!item) return;
    
    // Check if player has enough coins
    if(bank >= item.price){
        // Deduct coins
        bank -= item.price;
        ls.set('bj_coins', bank);
        
        // Mark item as owned
        playerInventory[itemId] = true;
        saveInventory();
        
        // Apply item effects
        applyItemEffect(itemId);
    }
}
function applyItemEffect(itemId){
    // Apply effects based on item ID
    if(itemId === 3){ // Escudo Extra
        // Give an extra shield for this game
        boost = true;
    } else if(itemId === 4){ // Monedas Dobles (1 partida)
        // This would need to be handled in the coin collection logic
        // For now, we'll just note it's owned and handle it elsewhere
    }
    // Skins are purely cosmetic, no gameplay effect
}
function ad(cb){adBusy=true;const f=ok=>{adBusy=false;cb(ok)};
if(ADSGRAM_BLOCK&&window.Adsgram){try{Adsgram.init({blockId:ADSGRAM_BLOCK}).show().then(r=>f(!!(r&&r.done))).catch(e=>f(false))}catch(e){f(false)}}
else{f(false);}
}
function updateMissionProgress(){
    // Actualizar progreso de la misión según el estado actual del juego
    if(st==='play'){
        // Misión de distancia: actualizar progreso basada en la puntuación (asumiendo que puntuación es distancia en metros)
        if(dailyMission.id==='dist_500'){
            dailyMission.progress = Math.min(dailyMission.target, score);
            saveMission();
            if(!dailyMission.completed && dailyMission.progress >= dailyMission.target){
                dailyMission.completed = true;
                saveMission();
                bank += dailyMission.reward;
                ls.set('bj_coins', bank);
            }
        }
        // Misión de monedas: actualizar progreso basada en las monedas recogidas en esta partida
        // Nota: necesitamos saber cuántas monedas se han recogido en esta partida, no el total
        // Por ahora, usaremos una variable temporal o asumimos que las monedas en 'coins' son de esta partida
        // Pero 'coins' se reinicia en reset, así que sí representa monedas de la partida actual
        if(dailyMission.id==='coins_20'){
            dailyMission.progress = Math.min(dailyMission.target, coins);
            saveMission();
            if(!dailyMission.completed && dailyMission.progress >= dailyMission.target){
                dailyMission.completed = true;
                saveMission();
                bank += dailyMission.reward;
                ls.set('bj_coins', bank);
            }
        }
        if(dailyMission.id==='no_shield'){
            dailyMission.progress = shieldUsed ? 0 : dailyMission.target;
            saveMission();
            if(!dailyMission.completed && dailyMission.progress >= dailyMission.target){
                dailyMission.completed = true;
                saveMission();
                bank += dailyMission.reward;
                ls.set('bj_coins', bank);
            }
        }
        // Misión de revive: actualizar cuando se use el revive
        // Esto se hará en la función revive
        // Misión de no usar escudo: necesitamos saber si se ha usado el escudo en esta partida
        // Vamos a agregar una variable shieldUsed y actualizarla cuando se use el escudo
        // Para simplificar, asumiremos que si el escudo está activo (shield=true o inv>0) entonces se ha usado
        // Pero es mejor tener una variable específica
        // Por ahora, dejaremos esta misión para implementar más tarde o usar un enfoque diferente
        // Misión de combo: actualizar basada en el combo actual
        if(dailyMission.id==='combo_5'){
            dailyMission.progress = Math.min(dailyMission.target, combo);
            saveMission();
            if(!dailyMission.completed && dailyMission.progress >= dailyMission.target){
                dailyMission.completed = true;
                saveMission();
                bank += dailyMission.reward;
                ls.set('bj_coins', bank);
            }
        }
    }
}

    saveMission();
    if(!dailyMission.completed && dailyMission.progress >= dailyMission.target){
        dailyMission.completed = true;
        saveMission();
        bank += dailyMission.reward;
        ls.set('bj_coins', bank);
    }
}
revives++;b.s=null;if(b.k==2)b.k=0;P.x=b.x+b.w/2;P.y=b.y-14;P.vy=-720;inv=2;st='play';held=false;snd(660,.15,'triangle')})}
function btn(l,x,y,w,h,fn,c){btns.push({x,y,w,h,fn});g.fillStyle=c;g.beginPath();g.roundRect(x,y,w,h,12);g.fill();tx(l,x+w/2,y+h/2+6,16,'#fff',700)}

for(const p of pl){if(p.k==1)p.x=p.bx+Math.sin(p.ph+T*1.6)*45;
if(p.br>0){p.br-=dt;if(p.br<=0){p.dead=true;burst(p.x+p.w/2,p.y,10,'#d8c3a5')}}}

if(P.x<14){P.x=14;P.dir=1}else if(P.x>W-14){P.x=W-14;P.dir=-1}

g.save();g.translate(P.x,P.y-cam+14);g.scale(sx,sy);g.fillStyle='#6df0b0';g.beginPath();g.arc(0,-14,14,0,6.283);g.fill();

for(const o of[-5,5]){g.fillStyle='#fff';g.beginPath();g.arc(o+ex,-17,4.6,0,6.283);g.fill();g.fillStyle='#10182b';g.beginPath();g.arc(o+ex+P.dir*1.5,-17+ey,2.2,0,6.283);g.fill()}

            g.fillStyle='#fff';
            g.textAlign='center';
            tx('Misión completada!',W/2,300,20,'#fff');
        }
    }
    g.fillStyle='#3a4a82';
    g.fillRect(W/2-60,H-80,120,40);
    g.fillStyle='#fff';
    g.textAlign='center';
    tx('Volver',W/2,H-60,16,'#fff',400);
}
if(adBusy){g.fillStyle='rgba(8,12,24,.88)';g.fillRect(0,0,W,H);tx((ADSGRAM_BLOCK||MONETAG_ZONE)?'Cargando anuncio…':'Anuncio de prueba…',W/2,H/2,22,'#fff',700)}}
let last=0;
function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;T+=dt;
if(st=='play'){upd(dt);updateMissionProgress();}
if(shake>0)shake-=dt;
for(const p of pt){p.vy+=600*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}pt=pt.filter(p=>p.l>0);
draw();requestAnimationFrame(loop)}
function down(x,y){if(adBusy)return;if(x!=null)for(const b of btns)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return}
if(st=='rank'){st=prev;return}
if(st=='shop'||st=='missions'){st=prev;return}
if(st=='ready'||(st=='dead'&&performance.now()-dieT>300)){reset();st='play';held=true;snd(440,.08,'triangle');return}
if(st=='play'){held=true;P.dir*=-1;snd(300,.04,'square',.03)}}
function up(){held=false}
document.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();down((e.clientX-r.left)/S,(e.clientY-r.top)/S)});
document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.repeat)return;if(['Space','ArrowLeft','ArrowRight','ArrowUp'].includes(e.code)){e.preventDefault();down()}});
addEventListener('keyup',e=>{if(['Space','ArrowLeft','ArrowRight','ArrowUp'].includes(e.code))up()});
document.addEventListener('contextmenu',e=>e.preventDefault());
reset();requestAnimationFrame(loop);
})();
</script></body></html>
